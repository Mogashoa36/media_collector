spring.application.name=collector

# PostgreSQL settings are supplied through environment variables in deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/media_collector}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Angular development server and the packaged extension preview.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
